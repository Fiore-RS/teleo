<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>teleo</title>

    <meta name="theme-color" content="#7A2E3A" />
    <!-- Aplica el modo y el tema de color guardados antes de pintar la página, para que no se
         vea un instante el tema por defecto. La misma lógica está en src/context/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var mode = localStorage.getItem('teleo-theme')
          if (localStorage.getItem('teleo-mode-reset-2.1') !== 'hecho') mode = 'system'
          var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')
          var palette = localStorage.getItem('teleo-palette')
          if (palette) root.dataset.palette = palette
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Teleo" />
    <link rel="apple-touch-icon" href="/pwa-icons/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
